name: artist_in
description: Artista - Entertainment & Community Platform
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^8.1.0
  image_picker: ^1.2.3
  http: ^1.2.0
  flutter_native_splash: ^2.3.10
  stomp_dart_client: ^3.0.1
  video_player: ^2.13.0
  url_launcher: ^6.3.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  visibility_detector: ^0.4.0+2
  chewie: ^1.8.5
  flutter_local_notifications: ^18.0.1
  device_info_plus: ^11.2.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/Artist.inlogo.png
    - assets/icon/app_icon.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/Artist.inlogo.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/Artist.inlogo.png